# =============================================
# docker-compose.yml — Open Investment (Oracle XE 21c + API Spring Boot)
# Um único arquivo para os dois ambientes. O que muda entre staging e
# produção vem de variáveis (env/*.env) e do nome do projeto (-p):
#   Produção: docker compose -p openinvest-prod --env-file env/production.env up -d --build --wait
#   Staging : docker compose -p openinvest-stg  --env-file env/staging.env    up -d --build --wait
# Local simples: cp .env.example .env && docker compose up --build
# =============================================

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim-faststart
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${DB_PASS:-openinvest123}
      APP_USER: ${DB_USER:-openinvest}
      APP_USER_PASSWORD: ${DB_PASS:-openinvest123}
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 20s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: XEPDB1
      DB_USER: ${DB_USER:-openinvest}
      DB_PASS: ${DB_PASS:-openinvest123}
      JWT_SECRET: ${JWT_SECRET:-openInvestmentSecretKey2026ESGSocialProjectsSecureKey}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  app-net:
    driver: bridge

volumes:
  oracle-data:
