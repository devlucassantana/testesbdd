# =============================================
# APPLICATION
# =============================================
spring.application.name=open-investment
server.port=8080

# =============================================
# ORACLE DATABASE
# =============================================
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
spring.datasource.username=${DB_USER:openinvest}
spring.datasource.password=${DB_PASS:openinvest123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# FLYWAY
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# =============================================
# SPRING SECURITY / JWT
# =============================================
app.jwt.secret=${JWT_SECRET:openInvestmentSecretKey2026ESGSocialProjectsSecureKey}
app.jwt.expiration-ms=86400000

# =============================================
# SPRINGDOC / SWAGGER
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =============================================
# ACTUATOR (health check Docker)
# =============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# =============================================
# LOGGING
# =============================================
logging.level.br.com.openinvestment=INFO
logging.level.org.flywaydb=INFO
