name: Open Investment - CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE_NAME: open-investment-api

jobs:
  # JOB 1 - Build e testes automatizados
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build (compila e empacota, sem testes)
        run: mvn -B -ntp -DskipTests package

      - name: Testes automatizados (JUnit 5 + Mockito, H2 em memória)
        run: mvn -B -ntp test
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # JOB 2 - Build da imagem Docker (o Dockerfile compila com Maven internamente)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker images ${{ env.IMAGE_NAME }}

  # JOBS 3 e 4 - Deploy real (efêmero) no runner: sobe Oracle + API via
  # Docker Compose, roda smoke test e registra o resultado no resumo do job.

  deploy-staging:
    name: Deploy - Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    env:
      COMPOSE: docker compose -p openinvest-stg --env-file env/staging.env
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'stagingSecretKey2026ESGOpenInvestmentStagingEnv' }}
      DB_PASS: ${{ secrets.DB_PASS || 'staging_pass_123' }}
    steps:
      - uses: actions/checkout@v4

      - name: Subir ambiente (staging) com Docker Compose
        run: $COMPOSE up -d --build --wait --wait-timeout 900

      - name: Smoke test (health, login, endpoint protegido)
        run: bash scripts/smoke-test.sh 8081 | tee smoke.log

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: bdd-tests/pom.xml

      - name: Testes BDD de API (Cucumber + REST Assured + JSON Schema)
        run: mvn -B -ntp -f bdd-tests/pom.xml test | tee bdd.log
        env:
          BASE_URL: http://localhost:8081

      - name: Publicar relatório BDD (HTML, JSON, XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-bdd-cucumber
          path: bdd-tests/target/cucumber-report/
          if-no-files-found: warn

      - name: Resumo dos testes BDD
        if: always()
        run: |
          {
            echo '### Testes BDD (Cucumber) - Staging'
            echo '```'
            grep -E "Scenarios|Steps|Tests run|BUILD" bdd.log 2>/dev/null | tail -8 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo '### Deploy staging - porta 8081'
            echo '```'
            $COMPOSE ps
            cat smoke.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs dos containers (somente em falha)
        if: failure()
        run: $COMPOSE logs --tail 200

      - name: Derrubar ambiente efêmero
        if: always()
        run: $COMPOSE down -v

  deploy-production:
    name: Deploy - Producao
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      COMPOSE: docker compose -p openinvest-prod --env-file env/production.env
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'openInvestmentSecretKey2026ESGSocialProjectsSecureKey' }}
      DB_PASS: ${{ secrets.DB_PASS || 'openinvest123' }}
    steps:
      - uses: actions/checkout@v4

      - name: Subir ambiente (production) com Docker Compose
        run: $COMPOSE up -d --build --wait --wait-timeout 900

      - name: Smoke test (health, login, endpoint protegido)
        run: bash scripts/smoke-test.sh 8080 | tee smoke.log

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo '### Deploy production - porta 8080'
            echo '```'
            $COMPOSE ps
            cat smoke.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs dos containers (somente em falha)
        if: failure()
        run: $COMPOSE logs --tail 200

      - name: Derrubar ambiente efêmero
        if: always()
        run: $COMPOSE down -v
